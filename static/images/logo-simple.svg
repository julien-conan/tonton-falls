<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="160" height="64">
  <!-- Longboard deck - pointed ends, wide in middle -->
  <path d="M 30 35 L 50 25 L 150 25 L 170 35 L 150 45 L 50 45 Z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Grip tape cross lines -->
  <line x1="60" y1="28" x2="140" y2="28" stroke="#fff" stroke-width="0.5" opacity="0.5"/>
  <line x1="55" y1="35" x2="145" y2="35" stroke="#fff" stroke-width="0.5" opacity="0.5"/>
  <line x1="60" y1="42" x2="140" y2="42" stroke="#fff" stroke-width="0.5" opacity="0.5"/>
  
  <!-- Left wheel -->
  <circle cx="55" cy="55" r="8" fill="none" stroke="#fff" stroke-width="2"/>
  <circle cx="55" cy="55" r="4" fill="#fff" opacity="0.6"/>
  
  <!-- Right wheel -->
  <circle cx="145" cy="55" r="8" fill="none" stroke="#fff" stroke-width="2"/>
  <circle cx="145" cy="55" r="4" fill="#fff" opacity="0.6"/>
  
  <!-- Axles connecting to board -->
  <line x1="55" y1="45" x2="55" y2="47" stroke="#fff" stroke-width="1"/>
  <line x1="145" y1="45" x2="145" y2="47" stroke="#fff" stroke-width="1"/>
</svg>